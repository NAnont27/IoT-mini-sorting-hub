<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220">
<style>text{font-family:Tahoma,"Noto Sans Thai",sans-serif} .wire{fill:none;stroke-linejoin:round;stroke-linecap:round}</style>
<rect width="1600" height="1220" fill="#f6f8fb"/>
<rect x="25" y="20" width="1550" height="112" rx="18" fill="#173b65" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="67" font-size="32" fill="white" font-weight="700" text-anchor="start">3 / E18-D80NK — วงจรตัวต้านทาน v2 / ไม่ใช้ PC817</text>
<text x="50" y="108" font-size="20" fill="#dbeafe" font-weight="400" text-anchor="start">1 ช่อง = R1 1kΩ + R2 10kΩ + R3 15kΩ • ทำซ้ำสี่ชุด • GPIO ต้องต่อจุด B เท่านั้น</text>
<rect x="40" y="170" width="1520" height="680" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="80" y="313" width="160" height="36" rx="6" fill="#dc2626" stroke="#dc2626" stroke-width="2"/>
<text x="160.0" y="337" font-size="17" fill="white" font-weight="700" text-anchor="middle">EXT +5V</text>
<polyline class="wire" points="240,330 320,330" stroke="#dc2626" stroke-width="4"/>
<polyline class="wire" points="320,330 340,330" stroke="#dc2626" stroke-width="4"/>
<rect x="340" y="318" width="140" height="24" rx="3" fill="#fef3c7" stroke="#8a6330" stroke-width="2"/>
<polyline class="wire" points="480,330 500,330" stroke="#dc2626" stroke-width="4"/>
<text x="410.0" y="307" font-size="18" fill="#17212b" font-weight="400" text-anchor="middle">R1 = 1kΩ</text>
<polyline class="wire" points="500,330 630,330" stroke="#dc2626" stroke-width="4"/>
<circle cx="630" cy="330" r="6" fill="#dc2626"/>
<text x="630" y="265" font-size="23" fill="#17212b" font-weight="700" text-anchor="middle">จุด A · OUT เซนเซอร์</text>
<polyline class="wire" points="630,330 800,330" stroke="#17212b" stroke-width="4"/>
<polyline class="wire" points="800,330 820,330" stroke="#17212b" stroke-width="4"/>
<rect x="820" y="318" width="130" height="24" rx="3" fill="#fef3c7" stroke="#8a6330" stroke-width="2"/>
<polyline class="wire" points="950,330 970,330" stroke="#17212b" stroke-width="4"/>
<text x="885.0" y="307" font-size="18" fill="#17212b" font-weight="400" text-anchor="middle">R2 = 10kΩ</text>
<polyline class="wire" points="970,330 1100,330" stroke="#7c3aed" stroke-width="4"/>
<circle cx="1100" cy="330" r="6" fill="#7c3aed"/>
<text x="1100" y="265" font-size="23" fill="#17212b" font-weight="700" text-anchor="middle">จุด B · เข้า GPIO</text>
<polyline class="wire" points="1100,330 1340,330" stroke="#7c3aed" stroke-width="4"/>
<rect x="1340" y="313" width="170" height="36" rx="6" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/>
<text x="1425.0" y="337" font-size="17" fill="white" font-weight="700" text-anchor="middle">GPIO11–14</text>
<polyline class="wire" points="1100,330 1100,420" stroke="#17212b" stroke-width="4"/>
<rect x="1086" y="420" width="28" height="100" rx="3" fill="#fef3c7" stroke="#8a6330" stroke-width="2"/>
<text x="1150" y="477" font-size="22" fill="#17212b" font-weight="700" text-anchor="start">R3 = 15kΩ</text>
<polyline class="wire" points="1100,520 1100,626" stroke="#17212b" stroke-width="4"/>
<rect x="1040" y="626" width="120" height="36" rx="6" fill="#17212b" stroke="#17212b" stroke-width="2"/>
<text x="1100.0" y="650" font-size="17" fill="white" font-weight="700" text-anchor="middle">GND</text>
<text x="970" y="710" font-size="23" fill="#9f1239" font-weight="700" text-anchor="start">ไม่ต่อจุด A เข้า GPIO ตรง</text>
<text x="970" y="752" font-size="21" fill="#173b65" font-weight="700" text-anchor="start">โค้ด IR: pinMode(pin, INPUT)</text>
<text x="970" y="791" font-size="20" fill="#17212b" font-weight="400" text-anchor="start">LOW = พบวัตถุ / HIGH = ว่าง</text>
<rect x="80" y="540" width="340" height="230" rx="12" fill="#fff8dc" stroke="#ca8a04" stroke-width="2"/>
<text x="110" y="580" font-size="22" fill="#17212b" font-weight="700" text-anchor="start">E18-D80NK · NPN NO</text>
<text x="110" y="615" font-size="21" fill="#17212b" font-weight="400" text-anchor="start">น้ำตาล · VCC</text>
<text x="110" y="676" font-size="21" fill="#17212b" font-weight="400" text-anchor="start">ดำ · OUT</text>
<text x="110" y="740" font-size="21" fill="#17212b" font-weight="400" text-anchor="start">น้ำเงิน · GND</text>
<circle cx="420" cy="595" r="6" fill="#dc2626"/>
<polyline class="wire" points="420,595 460,595" stroke="#dc2626" stroke-width="4"/>
<rect x="460" y="578" width="130" height="36" rx="6" fill="#dc2626" stroke="#dc2626" stroke-width="2"/>
<text x="525.0" y="602" font-size="17" fill="white" font-weight="700" text-anchor="middle">EXT +5V</text>
<circle cx="420" cy="660" r="6" fill="#17212b"/>
<polyline class="wire" points="420,660 630,660 630,330" stroke="#17212b" stroke-width="4"/>
<circle cx="420" cy="725" r="6" fill="#17212b"/>
<polyline class="wire" points="420,725 460,725" stroke="#17212b" stroke-width="4"/>
<rect x="460" y="708" width="130" height="36" rx="6" fill="#17212b" stroke="#17212b" stroke-width="2"/>
<text x="525.0" y="732" font-size="17" fill="white" font-weight="700" text-anchor="middle">GND</text>
<rect x="40" y="880" width="1520" height="295" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="80" y="924" font-size="25" fill="#17212b" font-weight="700" text-anchor="start">ทำซ้ำวงจรข้างบน แยกจุด A/B ของแต่ละเซนเซอร์</text>
<text x="80" y="977" font-size="22" fill="#17212b" font-weight="700" text-anchor="start">E18 1: TRAY EXIT</text>
<text x="80" y="1017" font-size="21" fill="#17212b" font-weight="400" text-anchor="start">จุด B → GPIO11</text>
<text x="80" y="1054" font-size="17" fill="#17212b" font-weight="400" text-anchor="start">1kΩ ×1 / 10kΩ ×1 / 15kΩ ×1</text>
<text x="455" y="977" font-size="22" fill="#17212b" font-weight="700" text-anchor="start">E18 2: A</text>
<text x="455" y="1017" font-size="21" fill="#17212b" font-weight="400" text-anchor="start">จุด B → GPIO12</text>
<text x="455" y="1054" font-size="17" fill="#17212b" font-weight="400" text-anchor="start">1kΩ ×1 / 10kΩ ×1 / 15kΩ ×1</text>
<text x="830" y="977" font-size="22" fill="#17212b" font-weight="700" text-anchor="start">E18 3: B</text>
<text x="830" y="1017" font-size="21" fill="#17212b" font-weight="400" text-anchor="start">จุด B → GPIO13</text>
<text x="830" y="1054" font-size="17" fill="#17212b" font-weight="400" text-anchor="start">1kΩ ×1 / 10kΩ ×1 / 15kΩ ×1</text>
<text x="1205" y="977" font-size="22" fill="#17212b" font-weight="700" text-anchor="start">E18 4: HOLD</text>
<text x="1205" y="1017" font-size="21" fill="#17212b" font-weight="400" text-anchor="start">จุด B → GPIO14</text>
<text x="1205" y="1054" font-size="17" fill="#17212b" font-weight="400" text-anchor="start">1kΩ ×1 / 10kΩ ×1 / 15kΩ ×1</text>
<text x="80" y="1100" font-size="20" fill="#17212b" font-weight="700" text-anchor="start">รวม IR: 1kΩ ×4 + 10kΩ ×4 + 15kΩ ×4   •   LED: 330Ω ×3   →   รวม R 15 ตัว (¼W)</text>
<text x="80" y="1141" font-size="18" fill="#9f1239" font-weight="400" text-anchor="start">ไฟ regulated 5V เท่านั้น • วัดจุด B ก่อนต่อ GPIO: HIGH ราว 2.9–3.0V / LOW ใกล้ 0V • เปิด ESP32 ก่อน Adapter</text>
</svg>