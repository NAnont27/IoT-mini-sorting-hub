<circle cx="800" cy="365" r="6" fill="#17212b"/>
<circle cx="1120" cy="365" r="6" fill="#17212b"/>
<text x="1160" y="373" font-size="22" fill="#17212b" font-weight="700" text-anchor="start">GND</text>
<polyline class="wire" points="900,180 900,420 1120,420" stroke="#ca8a04" stroke-width="4"/>
<circle cx="900" cy="420" r="6" fill="#ca8a04"/>
<circle cx="1120" cy="420" r="6" fill="#ca8a04"/>
<text x="1160" y="428" font-size="22" fill="#17212b" font-weight="700" text-anchor="start">SDA</text>
<polyline class="wire" points="1000,180 1000,475 1120,475" stroke="#0284c7" stroke-width="4"/>
<circle cx="1000" cy="475" r="6" fill="#0284c7"/>
<circle cx="1120" cy="475" r="6" fill="#0284c7"/>
<text x="1160" y="483" font-size="22" fill="#17212b" font-weight="700" text-anchor="start">SCL</text>
<text x="1160" y="545" font-size="21" fill="#17212b" font-weight="700" text-anchor="start">ADDR → GND</text>
<rect x="1120" y="650" width="620" height="350" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="1160" y="695" font-size="29" fill="#17212b" font-weight="700" text-anchor="start">AS5600</text>
<text x="1560" y="695" font-size="25" fill="#173b65" font-weight="700" text-anchor="start">0x36</text>
<polyline class="wire" points="700,180 700,740 1120,740" stroke="#d97706" stroke-width="4"/>
<circle cx="700" cy="740" r="6" fill="#d97706"/>
<circle cx="1120" cy="740" r="6" fill="#d97706"/>
<text x="1160" y="748" font-size="22" fill="#17212b" font-weight="700" text-anchor="start">VCC</text>
<polyline class="wire" points="800,180 800,795 1120,795" stroke="#17212b" stroke-width="4"/>
<circle cx="800" cy="795" r="6" fill="#17212b"/>
<circle cx="1120" cy="795" r="6" fill="#17212b"/>
<text x="1160" y="803" font-size="22" fill="#17212b" font-weight="700" text-anchor="start">GND</text>
<polyline class="wire" points="900,180 900,850 1120,850" stroke="#ca8a04" stroke-width="4"/>
<circle cx="900" cy="850" r="6" fill="#ca8a04"/>
<circle cx="1120" cy="850" r="6" fill="#ca8a04"/>
<text x="1160" y="858" font-size="22" fill="#17212b" font-weight="700" text-anchor="start">SDA</text>
<polyline class="wire" points="1000,180 1000,905 1120,905" stroke="#0284c7" stroke-width="4"/>
<circle cx="1000" cy="905" r="6" fill="#0284c7"/>
<circle cx="1120" cy="905" r="6" fill="#0284c7"/>
<text x="1160" y="913" font-size="22" fill="#17212b" font-weight="700" text-anchor="start">SCL</text>
<text x="1160" y="975" font-size="20" fill="#17212b" font-weight="400" text-anchor="start">OUT / DIR / PGO: ไม่ต่อ</text>
<rect x="550" y="1040" width="1190" height="90" rx="12" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="2"/>
<text x="580" y="1077" font-size="22" fill="#17212b" font-weight="700" text-anchor="start">AS5600: แม่เหล็ก Diametric ตรงกลางเหนือชิป เริ่มห่าง 1–2 มม.</text>
<text x="580" y="1110" font-size="20" fill="#17212b" font-weight="400" text-anchor="start">บอร์ดอยู่นิ่ง หมุนแม่เหล็กรอบแกนของมัน • i2cdetect ควรพบ 23 และ 36</text>
<rect x="50" y="1155" width="1690" height="120" rx="12" fill="#fff7ed" stroke="#edbd80" stroke-width="2"/>
<text x="80" y="1192" font-size="23" fill="#17212b" font-weight="700" text-anchor="start">GND ของ Pi pin6 → ต่อร่วม ESP32 GND / ลบ Adapter</text>
<text x="80" y="1230" font-size="20" fill="#9f1239" font-weight="400" text-anchor="start">ห้ามนำ +5V จาก Adapter Servo มาเชื่อมขาไฟ Pi • Camera Module 3 ใช้สาย CSI 15→22 pin แยก (ฝั่ง AI)</text>
<text x="80" y="1263" font-size="18" fill="#17212b" font-weight="400" text-anchor="start">ภาพเป็นผัง breakout เชิงตรรกะ ไม่ใช่ตำแหน่งขาจริงบนตัวบอร์ด • ถอดไฟก่อนต่อสาย</text>
</svg>