<text x="85" y="920" font-size="21" fill="#fee2e2" font-weight="700" text-anchor="start">Pin2 / Pin4 (5V): ไม่ใช้</text>
<text x="85" y="965" font-size="21" fill="white" font-weight="400" text-anchor="start">USB-C PSU ของ Pi</text>
<text x="85" y="1005" font-size="21" fill="#dbeafe" font-weight="700" text-anchor="start">Wi-Fi MQTT ↔ ESP32</text>
<rect x="1120" y="220" width="620" height="350" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
