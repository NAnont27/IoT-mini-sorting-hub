<text x="80" y="828" font-size="23" fill="white" font-weight="700" text-anchor="start">Pin 5 · SCL / GPIO3</text>
<circle cx="510" cy="820" r="6" fill="#0284c7"/>
<polyline class="wire" points="510,820 1000,820 1000,180" stroke="#0284c7" stroke-width="4"/>
