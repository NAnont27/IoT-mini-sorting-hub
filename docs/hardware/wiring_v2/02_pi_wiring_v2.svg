<text x="700.0" y="180" font-size="17" fill="white" font-weight="700" text-anchor="middle">3V3</text>
<text x="80" y="628" font-size="23" fill="white" font-weight="700" text-anchor="start">Pin 6 · GND</text>
<circle cx="510" cy="620" r="6" fill="#17212b"/>
<polyline class="wire" points="510,620 800,620 800,180" stroke="#17212b" stroke-width="4"/>
<circle cx="800" cy="620" r="6" fill="#17212b"/>
<rect x="760" y="156" width="80" height="36" rx="6" fill="#17212b" stroke="#17212b" stroke-width="2"/>
<text x="800.0" y="180" font-size="17" fill="white" font-weight="700" text-anchor="middle">GND</text>
<text x="80" y="728" font-size="23" fill="white" font-weight="700" text-anchor="start">Pin 3 · SDA / GPIO2</text>
<circle cx="510" cy="720" r="6" fill="#ca8a04"/>
<polyline class="wire" points="510,720 900,720 900,180" stroke="#ca8a04" stroke-width="4"/>
