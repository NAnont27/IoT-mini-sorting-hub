<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1310" viewBox="0 0 1800 1310">
<style>text{font-family:Tahoma,"Noto Sans Thai",sans-serif} .wire{fill:none;stroke-linejoin:round;stroke-linecap:round}</style>
<rect width="1800" height="1310" fill="#f6f8fb"/>
<rect x="25" y="20" width="1750" height="112" rx="18" fill="#173b65" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="67" font-size="32" fill="white" font-weight="700" text-anchor="start">2 / Raspberry Pi 5 — ผัง v2 / AS5600 + BH1750</text>
<text x="50" y="108" font-size="20" fill="#dbeafe" font-weight="400" text-anchor="start">เลขฝั่ง Pi เป็นตำแหน่งขาจริง (PHYSICAL PIN) • ใช้ไฟเซนเซอร์ 3.3V • สายสัญญาณต่อขนาน</text>
<rect x="50" y="180" width="460" height="900" rx="20" fill="#176247" stroke="#176247" stroke-width="2"/>
<text x="280" y="235" font-size="30" fill="white" font-weight="700" text-anchor="middle">Raspberry Pi 5</text>
<rect x="130" y="280" width="300" height="120" rx="8" fill="#bbc3c8" stroke="#e5e7eb" stroke-width="2"/>
<text x="280" y="350" font-size="35" fill="#173b65" font-weight="700" text-anchor="middle">Pi 5</text>
<text x="85" y="450" font-size="22" fill="white" font-weight="700" text-anchor="start">ขาที่นำออกมาใช้:</text>
<text x="80" y="528" font-size="23" fill="white" font-weight="700" text-anchor="start">Pin 1 · 3.3V</text>
<circle cx="510" cy="520" r="6" fill="#d97706"/>
<polyline class="wire" points="510,520 700,520 700,180" stroke="#d97706" stroke-width="4"/>
